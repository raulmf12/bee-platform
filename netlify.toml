# Netlify config — Bee Consulting Platform

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — todas rotas profundas (ex: /editor, /posts/abc) servem index.html
# pra o React Router lidar do client side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguranca + cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
